/* Motion pass: quiet, layered movement that keeps the dashboard readable. */
body{background:radial-gradient(ellipse at 78% 0%,#211016 0%,#0b0a0d 34%,#09090b 72%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.14;background-image:radial-gradient(circle at 76% 12%,transparent 0 72px,#a43b4b 73px 74px,transparent 75px 112px,#a43b4b 113px 114px,transparent 115px 154px,#a43b4b 155px 156px,transparent 157px),repeating-conic-gradient(from 8deg at 76% 12%,transparent 0deg 14deg,#6c2935 14.3deg 14.7deg,transparent 15deg 30deg);mask-image:linear-gradient(110deg,transparent 20%,#000 70%);animation:web-drift 32s ease-in-out infinite alternate}
.shell{position:relative;z-index:1}
.mark{animation:mark-breathe 5s ease-in-out infinite;transition:transform .35s,box-shadow .35s}
.brand:hover .mark{transform:rotate(0) scale(1.1);box-shadow:0 0 32px #e3485860}
.brand-name b{display:inline-block;animation:dot-pulse 2.8s ease-in-out infinite}
.nav button{overflow:hidden;transition:background .25s,border-color .25s,color .25s,transform .25s}
.nav button:hover{transform:translateX(3px)}
.nav button.active{box-shadow:inset 0 0 22px #e3485808,0 0 22px #e3485808}
.active-edge{animation:edge-in .25s ease-out}
.page{position:relative;animation:page-in .55s cubic-bezier(.2,.75,.25,1) both}
.welcome-row h1{animation:title-in .65s cubic-bezier(.2,.75,.25,1) both}
.welcome-row h1 span,.page-heading h1 span{background:linear-gradient(100deg,#f16a78,#b72d42,#f18b95,#e34858);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:crimson-flow 8s ease-in-out infinite}
.quick-add{position:relative;overflow:hidden;transition:border-color .3s,transform .3s,box-shadow .3s;animation:soft-rise .65s .08s both}
.quick-add:after{content:"";position:absolute;top:-60%;left:-45%;width:28%;height:220%;transform:rotate(22deg);background:linear-gradient(90deg,transparent,#ffffff0a,transparent);animation:panel-sheen 9s 1.5s ease-in-out infinite;pointer-events:none}
.quick-add:hover{border-color:#79404a;box-shadow:0 12px 44px #b62e4012;transform:translateY(-2px)}
.stat-card{transition:transform .3s,border-color .3s,box-shadow .3s;animation:soft-rise .55s both}
.stat-card:nth-child(2){animation-delay:.06s}.stat-card:nth-child(3){animation-delay:.12s}.stat-card:nth-child(4){animation-delay:.18s}
.stat-card:hover{transform:translateY(-4px);border-color:#553039;box-shadow:0 12px 28px #0003}
.stat-icon{transition:transform .3s,color .3s}.stat-card:hover .stat-icon{transform:rotate(-7deg) scale(1.08);color:#ef7783}
.content-grid>.panel{animation:soft-rise .65s .16s both}
.content-grid>.panel:nth-child(2){animation-delay:.24s}
.watch-row{transition:background .22s}.watch-row:hover{background:#191519}
.product-thumb{transition:transform .3s,box-shadow .3s}.product-cell:hover .product-thumb{transform:rotate(-5deg) scale(1.08);box-shadow:0 0 18px #e3485822}
.parcel-progress span{position:relative;overflow:hidden;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.parcel-progress span:after,.stat-line span:after,.range-track span:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,#ffffff30 48%,transparent 72%);transform:translateX(-100%);animation:progress-glint 4.5s ease-in-out infinite}
.status-tag i,.live-dot,.updated-label i{animation:status-pulse 2.4s ease-in-out infinite}
.btn-primary,.btn-secondary,.upgrade,.icon-button,.round-link,.text-link,.add-watch-card{transition:transform .22s,border-color .22s,background .22s,box-shadow .22s}
.btn-primary:active,.btn-secondary:active,.icon-button:active,.upgrade:active{transform:scale(.97)}
.panel,.shipment-card{transition:border-color .25s,box-shadow .25s}
.panel:hover{border-color:#383039}
.shipment-card:hover{border-color:#57323b;box-shadow:0 10px 30px #0002}
.watch-card{animation:soft-rise .45s both}
.watch-card:nth-child(2){animation-delay:.05s}.watch-card:nth-child(3){animation-delay:.1s}.watch-card:nth-child(4){animation-delay:.15s}.watch-card:nth-child(5){animation-delay:.2s}
.watch-card:hover .range-track span{filter:brightness(1.2)}
.add-watch-card:hover .add-circle{transform:rotate(90deg);transition:transform .35s}
.add-circle{transition:transform .35s}
.today-mark{animation:orbit-glow 4s ease-in-out infinite}
.demo-pill i{animation:status-pulse 2s ease-in-out infinite}
.modal-backdrop{animation:backdrop-in .2s ease both}
.modal{animation:modal-in .3s cubic-bezier(.2,.8,.2,1) both}
.toast{animation:toast-in .25s ease both}
.footer{position:relative;z-index:1}
@keyframes page-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes soft-rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
@keyframes title-in{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes edge-in{from{opacity:0;transform:scaleY(.3)}to{opacity:1;transform:scaleY(1)}}
@keyframes status-pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 #e3485800}50%{opacity:.68;box-shadow:0 0 0 4px #e3485810}}
@keyframes dot-pulse{0%,100%{text-shadow:0 0 0 #e3485800}50%{text-shadow:0 0 14px #e3485890}}
@keyframes mark-breathe{0%,100%{box-shadow:0 0 20px #a91f3325}50%{box-shadow:0 0 30px #e3485850}}
@keyframes crimson-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes panel-sheen{0%,55%{left:-45%}78%,100%{left:130%}}
@keyframes progress-glint{0%,55%{transform:translateX(-100%)}85%,100%{transform:translateX(100%)}}
@keyframes orbit-glow{0%,100%{box-shadow:0 0 0 #e3485800}50%{box-shadow:0 0 18px #e3485825}}
@keyframes web-drift{from{transform:translate3d(0,0,0) rotate(0deg);opacity:.09}to{transform:translate3d(-10px,8px,0) rotate(2deg);opacity:.17}}
@keyframes backdrop-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
@media(max-width:900px){body:before{opacity:.08}.stat-card:hover,.nav button:hover{transform:none}}


/* Minimal Premium refresh + cinematic motion */
:root{color-scheme:dark;--surface:#111114;--line:#29282f;--muted:#85848d;--red:#e34858;--green:#7bd6a3;--canvas:#09090b;--panel:#111114;--panel-raised:#151518;--ink:#eeeef0;--ink-soft:#c8c6ce;--ink-muted:#85848d;--hairline:#29282f;--accent-wash:#211217;--accent-line:#48252d}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--canvas);color:var(--ink);transition:background .65s ease,color .45s ease}
body:before{opacity:.075;background-image:radial-gradient(circle at 78% 5%,transparent 0 100px,#a43b4b 101px 102px,transparent 103px 155px,#a43b4b 156px 157px,transparent 158px 215px),repeating-conic-gradient(from 8deg at 78% 5%,transparent 0deg 19deg,#6c2935 19.3deg 19.6deg,transparent 20deg 40deg);mask-image:linear-gradient(135deg,transparent 20%,#000 85%)}
.sidebar{background:color-mix(in srgb,var(--canvas) 94%,transparent);backdrop-filter:blur(24px);border-color:var(--hairline);transition:background .45s,border-color .45s}
.topbar{background:color-mix(in srgb,var(--canvas) 84%,transparent);border-color:var(--hairline);backdrop-filter:blur(24px);transition:background .45s,border-color .45s}
.page{padding-top:44px}
.brand{padding-bottom:42px}
.brand-name{letter-spacing:-1.1px}
.nav button{padding:12px;border-radius:8px}
.nav button.active{background:linear-gradient(100deg,var(--accent-wash),color-mix(in srgb,var(--panel) 90%,transparent));border-color:var(--accent-line)}
.welcome-row h1,.page-heading h1{letter-spacing:-2.3px;line-height:1.12}
.subheading{line-height:1.85}
.quick-add{border-radius:13px;background:linear-gradient(110deg,color-mix(in srgb,var(--accent-wash) 72%,var(--panel)),var(--panel) 70%);border-color:color-mix(in srgb,var(--accent-line) 82%,var(--hairline));box-shadow:0 16px 48px #0000000a}
.stat-card,.panel,.watch-card,.shipment-card,.metric-strip,.bottom-note{box-shadow:0 1px 0 #ffffff03,0 8px 26px #0000000a}
.stat-card{background:linear-gradient(150deg,var(--panel-raised),var(--panel));border-color:var(--hairline);border-radius:12px;padding:17px}
.stat-value{font-variant-numeric:tabular-nums;letter-spacing:-1.4px}
.panel{border-radius:12px;background:var(--panel);border-color:var(--hairline)}
.panel-header{padding:19px}
.table-head{letter-spacing:1.2px}
.watch-row{transition:background .28s ease}
.watch-row:hover{background:color-mix(in srgb,var(--accent-wash) 45%,var(--panel))}
.watch-card{border-radius:13px;padding:18px;background:linear-gradient(145deg,var(--panel-raised),var(--panel));border-color:var(--hairline);box-shadow:0 5px 24px #0000000a;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s}
.watch-card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--red) 36%,var(--hairline));box-shadow:0 18px 38px #00000018}
.shipment-card{border-radius:13px}
.btn-primary{box-shadow:0 5px 18px #d83e5018;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .25s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px #d83e5033}
.btn-secondary:hover,.icon-button:hover{transform:translateY(-1px)}
.theme-toggle{font-size:17px;color:#e8bd7a;position:relative;overflow:hidden}
.theme-toggle:after{content:"";position:absolute;inset:-50%;background:linear-gradient(100deg,transparent 40%,#ffffff14 50%,transparent 60%);transform:translateX(-100%) rotate(15deg);transition:transform .6s}
.theme-toggle:hover:after{transform:translateX(100%) rotate(15deg)}

function priceHistoryFor(w){
 const full=priceHistories[w.id]||[];
 if(priceHistoryWindow==='7D')return full.slice(-3);
 if(priceHistoryWindow==='90D')return [{d:'Jul 25',p:Math.round(w.previous*1.13)},{d:'Aug 08',p:Math.round(w.previous*1.09)},{d:'Aug 22',p:Math.round(w.previous*1.06)},{d:'Sep 05',p:Math.round(w.previous*1.02)},...full.slice(-4)];

function priceVitalChart(w){

 const coords=pts.map((x,i)=>({x:36+i*(628/(Math.max(1,pts.length-1))),y:180-((x.p-min)/range)*132,p:x.p,d:x.d}));
 const path=coords.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');

}

}

 '<section class="spidey-tracker panel"><div class="tracker-heading"><div><div class="eyebrow">SPIDEY ROUTE TRACKER</div><h2>The journey <span>so far.</span></h2><p>Every stop leaves a trace. Follow the web from origin to destination.</p></div><div class="tracker-live"><i></i>'+selected.status.toUpperCase()+'</div></div>'+

 '<div class="spidey-map" role="img" aria-label="Stylized route map showing sample shipment checkpoints"><div class="map-topline"><span><i></i> ROUTE VISUALIZATION</span><span>INDIA · SAMPLE ROUTE</span></div><svg class="route-art" viewBox="0 0 800 310" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><pattern id="mapGrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="currentColor" stroke-opacity=".09" stroke-width="1"/></pattern><filter id="routeGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="800" height="310" fill="url(#mapGrid)"/><g class="map-roads" fill="none" stroke="currentColor" stroke-opacity=".13" stroke-width="2"><path d="M-20 90 Q110 35 190 115T360 90T540 145T830 70"/><path d="M-20 225 Q120 170 230 220T430 210T610 245T830 190"/><path d="M120 -20 Q175 75 135 140T190 330"/><path d="M340 -20 Q290 75 380 155T340 330"/><path d="M580 -20 Q520 75 600 160T570 330"/><path d="M-20 155 Q120 120 240 160T460 120T830 145"/></g><path class="route-shadow" d="M130 228 Q185 182 280 198 T420 125 T575 93 T690 48" fill="none" stroke="#e34858" stroke-opacity=".16" stroke-width="14" stroke-linecap="round"/><path class="route-line" d="M130 228 Q185 182 280 198 T420 125 T575 93 T690 48" fill="none" stroke="#e34858" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><path class="route-web" d="M130 228 L185 185 L280 198 L330 154 L420 125 L500 151 L575 93 L630 115 L690 48 M280 198 L260 140 L330 154 L370 80 L420 125 L470 55 L575 93 M420 125 L455 210 L500 151 L550 235 L610 180 L630 115" fill="none" stroke="#e34858" stroke-opacity=".3" stroke-width="1.2"/><g class="map-node" transform="translate(130 228)"><circle r="10" fill="#e34858" fill-opacity=".16"/><circle r="5" fill="#e34858"/><text x="0" y="27" text-anchor="middle">ORIGIN</text></g><g class="map-node" transform="translate(280 198)"><circle r="10" fill="#e34858" fill-opacity=".16"/><circle r="4" fill="#e34858"/><text x="0" y="26" text-anchor="middle">HUB 01</text></g><g class="map-node" transform="translate(420 125)"><circle r="10" fill="#e34858" fill-opacity=".16"/><circle r="4" fill="#e34858"/><text x="0" y="26" text-anchor="middle">HUB 02</text></g><g class="map-node" transform="translate(575 93)"><circle r="10" fill="#e34858" fill-opacity=".16"/><circle r="4" fill="#e34858"/><text x="0" y="26" text-anchor="middle">LAST MILE</text></g><g class="map-destination" transform="translate(690 48)" filter="url(#routeGlow)"><circle r="16" fill="#e34858" fill-opacity=".13"/><circle r="8" fill="#e34858"/><path d="M-4 -4L4 4M4 -4L-4 4" stroke="#fff" stroke-width="1.5"/><text x="-4" y="-20" text-anchor="end">DESTINATION</text></g><g class="spidey-marker" transform="translate('+(selected.status==='Delivered'?'690 48':selected.status==='Out for delivery'?'575 93':selected.progress>50?'420 125':'280 198')+')"><circle r="18" fill="#e34858" fill-opacity=".15"/><path d="M0 -9L-5 -3L-8 2L-5 5L0 3L5 5L8 2L5 -3Z" fill="#f5f2f3" stroke="#e34858" stroke-width="1.5"/><path d="M-5 -3L-11 -7M5 -3L11 -7M-7 2L-13 4M7 2L13 4M-4 5L-8 11M4 5L8 11" stroke="#f5f2f3" stroke-width="1.6" stroke-linecap="round"/></g></svg><div class="map-legend"><span><i class="legend-visited"></i> Recorded checkpoint</span><span><i class="legend-current"></i> Spidey marker · illustrative</span><span><i class="legend-next"></i> Next destination</span></div><div class="map-footnote">Illustrative route graphic · exact roads and live GPS are not connected in this demo.</div></div>'+
 '<div class="route-stops"><div class="route-stops-heading"><div><h3>Stops on the web</h3><p>'+journey.filter(j=>j.done).length+' checkpoints recorded · '+journey.filter(j=>!j.done).length+' upcoming</p></div><span class="route-count">'+journey.length+' STOPS</span></div><div class="route-stop-list">'+routeLabels+'</div></div></section>'+
 '<section class="tracking-changes panel"><div class="changes-heading"><div><div class="eyebrow">TRACKING HISTORY</div><h2>Every little <span>change.</span></h2><p>Updates are shown in reverse chronological order, newest first.</p></div><span class="history-badge">⌁ '+journey.filter(j=>j.done).length+' updates</span></div><div class="journey-timeline">'+timeline+'</div><div class="tracking-disclaimer">♧ <div><strong>Sample tracking activity</strong><p>These checkpoints are illustrative demo data, not live carrier scans. Real timestamps and locations will appear when carrier integrations are connected.</p></div></div></section>'+
 '<div class="carrier-note">♧ <div><strong>Carrier coverage will be added in stages.</strong><p>Live tracking depends on carrier APIs or approved aggregator integrations.</p></div></div>';
}
function settingsPage(){return header('YOUR EXPERIENCE','Make it <span>yours.</span>','A few choices to make your watchtower work for you.')+'<div class="settings-layout"><div class="settings-main"><section class="panel settings-panel"><div class="settings-title"><span class="settings-icon">♧</span><div><h2>Notifications</h2><p>Only the updates you care about.</p></div></div><div class="setting-row"><div><strong>Price change alerts</strong><p>Get notified when a watched price moves.</p></div><button class="toggle '+(emailAlerts?'on':'')+'" data-toggle="email"><span></span></button></div><div class="setting-row"><div><strong>Back-in-stock alerts</strong><p>Know when an unavailable product returns.</p></div><button class="toggle '+(stockAlerts?'on':'')+'" data-toggle="stock"><span></span></button></div><div class="setting-row"><div><strong>Delivery milestones</strong><p>Pickup, in transit, out for delivery, and more.</p></div><button class="toggle on" data-toggle="delivery"><span></span></button></div></section><section class="panel settings-panel"><div class="settings-title"><span class="settings-icon">◷</span><div><h2>Default watch frequency</h2><p>Choose how often new watches should be checked.</p></div></div><div class="frequency-options">'+['Daily','Every 6 hours','Every hour','Every 30 min'].map(f=>'<button data-frequency="'+f+'" class="'+((plan==='Free'?f==='Daily':frequency===f)?'chosen':'')+'"><span>'+f+'</span>'+((plan==='Free'?f==='Daily':frequency===f)?'<b>✓</b>':'')+'</button>').join('')+'</div><p class="fine-print">ⓘ Faster intervals are a preview only and require a server-side plan entitlement.</p></section></div><aside class="panel plan-detail"><div class="plan-detail-icon">ϟ</div><span class="plan-eyebrow">YOUR CURRENT PLAN</span><h2>'+(plan==='Free'?'The essentials.':'WebWatch Plus.')+'</h2><p>'+(plan==='Free'?'Everything you need to start keeping an eye on your prices and deliveries.':'More frequent checks for the products you care about most.')+'</p><div class="plan-feature"><b>✓</b> '+(plan==='Free'?'10 active price watches':'Up to 100 active watches')+'</div><div class="plan-feature"><b>✓</b> '+(plan==='Free'?'Daily price checks':'Checks as often as every 10 min')+'</div><div class="plan-feature"><b>✓</b> Shipment timeline previews</div><div class="plan-feature"><b>✓</b> Price movement alerts (when connected)</div><button class="btn-primary full" id="planToggle">'+(plan==='Free'?'Preview Plus':'Return to Free preview')+' →</button><small>No payment is processed in this demo.</small></aside></div>'}
function render(){const page=document.getElementById('page');page.innerHTML=tab==='Overview'?dashboard():tab==='Price watches'?pricePage():tab==='Deliveries'?deliveryPage():settingsPage();document.getElementById('watchCount').textContent=watches.length;document.getElementById('parcelCount').textContent=parcels.filter(p=>p.status!=='Delivered').length;
const ws=document.getElementById('watchSearch');if(ws){ws.addEventListener('input',e=>{query=e.target.value;const grid=document.getElementById('watchesGrid');const filtered=watches.filter(w=>(w.name+' '+w.retailer).toLowerCase().includes(query.toLowerCase()));grid.innerHTML=watchCards(filtered)});document.getElementById('freq').value=frequency;document.getElementById('freq').addEventListener('change',e=>{frequency=e.target.value;toast('Frequency updated in this preview.')});document.getElementById('filterBtn').onclick=()=>toast('All watch statuses are shown.')};
page.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.toggle==='email')emailAlerts=!emailAlerts;if(b.dataset.toggle==='stock')stockAlerts=!stockAlerts;if(b.dataset.toggle==='delivery'){toast('Delivery alert preference saved in this preview.');return}render()}));
page.querySelectorAll('[data-frequency]').forEach(b=>b.addEventListener('click',()=>{frequency=b.dataset.frequency==='Daily'?'Every 24 hours':b.dataset.frequency==='Every hour'?'Every 1 hour':b.dataset.frequency==='Every 30 min'?'Every 30 minutes':'Every 6 hours';toast('Default frequency updated in this preview.');render()}));
const pt=document.getElementById('planToggle');if(pt)pt.onclick=()=>{plan=plan==='Free'?'Plus':'Free';updatePlan();render();toast('Plan preview changed. No purchase was made.')}}
function openModal(type){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-top"><div class="modal-symbol">↗</div><button class="icon-button" id="closeModal">×</button></div><div class="eyebrow">ADD TO YOUR WATCHTOWER</div><h2>'+(type==='price'?'Put a price on your radar.':'Keep a parcel in sight.')+'</h2><p>'+(type==='price'?'Paste the product page URL. We will show the planned flow in this preview.':'Enter the tracking page URL or shipment number.')+'</p><form id="addForm"><label>'+(type==='price'?'PRODUCT URL':'TRACKING NUMBER OR URL')+'</label><div class="url-input">↗ <input id="urlInput" autofocus placeholder="'+(type==='price'?'https://store.com/product...':'Tracking number or carrier URL')+'"></div>'+(type==='price'?'<div class="modal-frequency"><label>CHECK FREQUENCY</label><select id="modalFreq" '+(plan==='Free'?'disabled':'')+'><option>Every 24 hours</option><option>Every 12 hours</option><option>Every 6 hours</option><option>Every 3 hours</option><option>Every 1 hour</option><option>Every 30 minutes</option><option>Every 15 minutes</option><option>Every 10 minutes</option></select><small>'+(plan==='Free'?'Free plan uses daily checks. Faster intervals are a Plus preview.':'Frequency is a preview; no live scheduler is connected.')+'</small></div>':'')+'<button class="btn-primary full submit-btn" type="submit">'+(type==='price'?'Add price watch':'Add shipment')+' →</button><div class="modal-foot">♧ Demo only · No URL is sent to a tracking service.</div></form></section></div>';document.getElementById('closeModal').onclick=()=>root.innerHTML='';document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')root.innerHTML=''};document.getElementById('addForm').onsubmit=e=>{e.preventDefault();const val=document.getElementById('urlInput').value.trim();if(!val){toast(type==='price'?'Paste a product link first.':'Enter a tracking number or shipment URL.');return}if(type==='price'){watches.unshift({id:Date.now(),name:'New product watch',retailer:'Link added · demo',price:0,previous:0,status:'In stock',target:0,icon:'W',color:'#f0c4cb'});frequency=plan==='Free'?'Every 24 hours':(document.getElementById('modalFreq')?.value||frequency);toast('Demo watch added. Live price checks are not connected yet.');switchTab('Price watches')}else{parcels.unshift({id:Date.now(),carrier:'Shipment · demo',code:'Pending setup',status:'Awaiting first scan',detail:'Your shipment would appear here once connected.',eta:'Not available yet',progress:12});toast('Demo shipment added. Carrier APIs are not connected yet.');switchTab('Deliveries')}root.innerHTML=''}}

// Theme preference is stored locally; the app works without an account.
function setTheme(mode,announce=false){const light=mode==='light';document.body.classList.toggle('light',light);const b=document.getElementById('themeToggle');if(b){b.textContent=light?'☾':'☼';b.title=light?'Switch to dark theme':'Switch to light theme';b.setAttribute('aria-label',b.title)}try{localStorage.setItem('webwatch-theme',light?'light':'dark')}catch(e){}if(announce)toast(light?'Light theme enabled.':'Dark theme enabled.')}
try{if(localStorage.getItem('webwatch-theme')==='light')document.body.classList.add('light')}catch(e){}
document.getElementById('themeToggle').onclick=()=>setTheme(document.body.classList.contains('light')?'dark':'light',true);
setTheme(document.body.classList.contains('light')?'light':'dark');

document.getElementById('bell').onclick=()=>toast('You are all caught up.');document.getElementById('privacy').onclick=e=>{e.preventDefault();toast('Privacy and terms will be published before launch.')};updatePlan();render();
</script></body></html>
